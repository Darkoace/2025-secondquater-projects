<!DOCTYPE html>
<html>
<head>
    <title>Shopping System</title>
</head>
<body>
    <h1>Search Products</h1>
    <form method="POST">
        <input type="text" name="item" placeholder="Enter product name" required>
        <button type="submit">Search</button>
    </form>

    {% if results %}
        <h2>Results:</h2>
        <ul>
            {% for row in results %}
                <li>{{ row[1] }} - R{{ row[2] }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
